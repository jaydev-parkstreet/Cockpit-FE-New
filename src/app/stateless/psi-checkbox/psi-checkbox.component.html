<div class="c-checkbox">
    <label class="label-checkbox u-flex u-align-center">
        <input [type]="field.type"
            [id]="field.name"
            [ngClass]="validationClasses"
            [placeholder]="field.placeholder"
            [required]="field.required"
            [attr.checked]="form.value[field.name] == '1' ? true : null"
            (change)="onChangeValue($event.target.checked)"/>
        <span class="c-checkbox__item">
            <em class="fas fa-check"></em>
        </span>
        <span class="label">{{ field.label }}</span>
    </label>
</div>
