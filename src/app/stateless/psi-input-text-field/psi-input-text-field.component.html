<div class="dropdown-label" [ngClass]="{'required': field.required || field.isRequired}">
    <span class="d-block" [textContent]="field.label"></span>
</div>
<div [ngClass]="{'disabled' : field.disabled}">
    <input *ngIf="field?.type == 'text'"  class="w-100"
    [ngClass]="validationClasses"
    [value]="valueEntered"
    [type]="field.type" [id]="field.name" [placeholder]="field.placeholder"
    [required]="field.required" (blur)="onValueChange($event)"
    (input)="onInputValueChange($event)"/>
</div>
