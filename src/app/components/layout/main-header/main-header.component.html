<div class="headerbar u-flex u-align-center u-pg-py-1">
    <div class="search-container u-pg-ml-3 position-relative">
        <input 
            type="text" 
            class="u-bg-neutral-light-t-10 u-neutral-light"
            placeholder="Search People and Companies"
            [(ngModel)]="searchText">
        <div class="icon-container h-100 position-absolute u-flex-center u-pg-g-1 u-csr-ptr">
            <i *ngIf="searchText" class="fa fa-times-circle u-neutral-light" (click)="clearSearchText()"></i>
            <div class="search-icon-container h-100 u-flex-center">
                <i class="far fa-search search-icon u-neutral-light"></i>
            </div>
        </div>
    </div>
</div>
