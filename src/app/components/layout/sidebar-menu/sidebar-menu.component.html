<div class="sidebar" [ngClass]="isSidebarExpanded ? 'expanded' : 'collapsed'">
    <div class="sidebar__header">
        <img [src]="isSidebarExpanded ? '../../../../assets/images/header-expanded-logo.svg' : '../../../../assets/images/header-collapsed-logo.svg'">
        <div class="menutoggle" (click)="toggleMenu()">
            <i [class]="isSidebarExpanded ? 'fas fa-chevron-left' : 'fas fa-chevron-right'"></i>
        </div>
    </div>
    <div class="sidebar__content">
        <div class="sidebar-menu open-current-submenu show-scrollbar">
                <ul id="mainMenu" class="sidebar-menu-list u-pg-px-1">
                    <li class="sidebar-menu-item" 
                    [ngClass]="{
                        'sidebar-menu-open': menu.isExpanded, 
                        'sidebar-menu-active': isActiveRoute(menu.url)
                    }"
                    *ngFor="let menu of menuData" (click)="toggleIcon(menu)">
                        <a [routerLink]="'/product-management'" (mouseover)="showMenu($event, $event.currentTarget)" 
                        (mouseleave)="hideMenu($event, $event.currentTarget)">
                            <i [class]="menu.icon" class="u-pg-mr-1 sidebar-icon"></i>
                            <span class="custom-width" *ngIf="isSidebarExpanded">{{menu.label}}</span>
                            <em class="toggle-icon"
                                [ngClass]= "menu.isExpanded ? 'fas fa-chevron-up' : 'fas fa-chevron-down'"
                                *ngIf="menu.submenuItems && isSidebarExpanded">
                            </em>
                        </a>
    
                        <ul id="mainMenu-items" *ngIf="menu.submenuItems" [ngStyle]="!isSidebarExpanded ? {} : {'display': menu.isExpanded ? 'block' : 'none'}">
                            <span class="sidebar-tooltip">{{menu.label}}</span>
                            <li class="sidebar-submenu-item" [ngClass]="{'sidebar-menu-active': isActiveRoute(submenu.frontend_app_route ? submenu.frontend_app_route : submenu.url)}" *ngFor="let submenu of menu.submenuItems" >
                                <a [routerLink]="submenu.url" *ngIf="submenu.label" (mouseover)="showSubmenu($event, $event.currentTarget)"
                                (mouseleave)="hideSubmenu($event, $event.currentTarget)">
                                    <span class="custom-width">{{submenu.label}}</span>
                                    <em class="fas fa-chevron-right toggle-icon" *ngIf="submenu.submenuItems"></em>
                                </a>
                                <ul class="submenu-item"  #submenuItem *ngIf="submenu.submenuItems" >
                                    <li class="sidebar-submenu-sub-item" *ngFor="let submenu of submenu.submenuItems">
                                        <a [routerLink]="submenu.url" *ngIf="submenu.label">
                                            <span class="custom-width">{{submenu.label}}</span>
                                        </a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                </ul> 
        </div>
    </div>
    <div class="sidebar__footer">
        <div class="footer-profile">
            <div class="footer-profile-main"          
            (click)="toggleDropdown()">
                <img [src]="oldCockpit + currentUserData.PictureUrl" alt=""/>
                <span *ngIf="currentUserData" class="user-name">
                    <span [innerText]="currentUserData.first_name"></span>
                    <span [innerText]="currentUserData.last_name"></span>
                </span>
                <i class="fas fa-chevron-right"></i>
            </div>
            <div class="footer-profile-list" *ngIf="isDropdownVisible">
              <span><a href=""> My Profile</a></span>
              <span><a href="#"> Account Settings</a></span>
              <span><a href="#"> Help</a></span>
              <span><a (click)="logout()"> Log Out</a></span>
            </div>
          </div>
    </div>
</div>
