<div class="product-management">
    <div class="header-background">
        <app-header-tool titleText="Product Tool" titleIcon="fas fa-file-invoice-dollar">
        </app-header-tool>
        <div class="product-tool-container">
            <div class="check-container">
                <div class="u-w-inherit">
                    <div>
                        <div class="form-wrapper">
                            <div class="psi-custom-form">
                                <div class="custom-form-wrapper">
                                    <div class="form-container">
                                        <div class="psi-form">
                                            <div class="form-title headers-container">
                                                <p class="product-details-header">PRODUCT DETAILS</p>
                                                <p class="codes-column">CODES</p>
                                            </div>
                                            <div class="form-group">
                                                <form [formGroup]="productForm" (ngSubmit)="onSubmit(productForm)"
                                                    autocomplete="false">
                                                    <div class="form-field">
                                                        <div class="row">
                                                            <div class="column">
                                                                <ng-container *ngFor="let field of formConfig.schema">
                                                                <ng-container *ngIf="!field.isVisible  ">
                                                                    <label [for]="field.name"
                                                                        [ngClass]="{'ps-required-asterisk': field.required}"
                                                                        [textContent]="field.label"></label>

                                                                    <input *ngIf="field?.type == 'text'"
                                                                        [type]="field.type"
                                                                        [ngClass]="{'ps-required-asterisk': isFieldInvalid(field.name)}"
                                                                        [id]="field.name" [formControlName]="field.name"
                                                                        [placeholder]="field.placeholder"
                                                                        [required]="field.required" />
                                                                    <app-cmp-input-dropdown
                                                                        *ngIf="field?.type == 'multiselect-search'"
                                                                        [showSelectAll]="true"
                                                                        [showCheckboxes]="true"
                                                                        [allowSingleSelect]="false"
                                                                        [settings]="field.setting"
                                                                        [filteredItems]="filterList[field.key]"
                                                                        (onDropDownChange)="onDropdownStateChange(field.name, $event)">
                                                                    </app-cmp-input-dropdown>

                                                                    <div *ngIf="isFieldInvalid(field.name)"
                                                                        class="error-message">
                                                                        <span
                                                                            *ngIf="productForm.get(field.name)?.errors?.required">Required</span>
                                                                    </div>
                                                                </ng-container>
                                                            </ng-container>

                                                            </div>
                                                            <div class="column-right">
                                                                <ng-container *ngFor="let field of formConfig.schema">

                                                                <ng-container *ngIf="field.isVisible">
                                                                    <label [for]="field.name"
                                                                        [ngClass]="{'ps-required-asterisk': field.required}"
                                                                        [textContent]="field.label"></label>

                                                                    <input *ngIf="field?.type == 'text'"
                                                                        [type]="field.type"
                                                                        [ngClass]="{'ps-required-asterisk': isFieldInvalid(field.name)}"
                                                                        [id]="field.name" [formControlName]="field.name"
                                                                        [placeholder]="field.placeholder"
                                                                        [required]="field.required" />

                                                                </ng-container>
                                                            </ng-container>

                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div class="form-submit-button">
                                                        <button type="submit" class="btn btn-primary">{{
                                                            formConfig.submitBtnLabel }}</button>
                                                        <button type="reset" class="cancel"
                                                            (click)="openConfirmationPopup()">{{
                                                            formConfig.cancelBtnLabel }}</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
