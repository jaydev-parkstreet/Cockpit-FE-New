<div class="modal-content content">
    <div class="modal-body">
        <div class="popup-header">
            <i *ngIf="modalData.iconClass" [ngClass]="modalData.iconClass || 'fas fa-exclamation-circle'"></i>
            <span *ngIf="modalData.title" [innerText]="modalData.title"></span>
        </div>
        <div class="popup-body">
            <span *ngIf="modalData.body" [innerText]="modalData.body"></span>
            <span *ngIf="modalData.body1" [innerText]="modalData.body1"></span>
        </div>
    </div>

    <div class="seperator"></div>

    <div class="modal-footer footer w-100">
        <app-cmp-button
            *ngFor="let btn of modalData.btnLabel"
            [buttonText]="btn.label"
            [buttonClass]="btn.class"
            (click)="onClickBtn(btn)">
        </app-cmp-button>
    </div>
</div>
