
<div class="form-wrapper">
    <div class="cockpit-logo"></div>
    <div class="bg-img-wrapper"></div>
    <div class="psi-custom-form">
        <div class="custom-form-wrapper">
            <div class="form-container">
                <div class="form-validation">
                    <div class="form-validation">
                        <div *ngIf="isShowLoginErrorMsg" class="validation-msg" [innerHTML]="showErrorMsg"></div>
                    </div>
                </div>
                <div class="psi-form">
                    <div class="form-title">
                        <h1 [textContent]="formTitle.firstline"></h1>
                        <p [textContent]="formTitle.secondline"></p>
                    </div>
                    <div class="form-group">
                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit(loginForm)" autocomplete="false">
                            <div class="form-field" *ngFor="let field of formConfig.schema; index as i ; trackBy: trackByField">
                                <label
                                    [for]="field.name"
                                    [ngClass]="{'ps-required-asterisk': field.required}"
                                    [textContent]="field.label">
                                </label>
                                <input
                                    [type]="field.type"
                                    [id]="field.name"
                                    [formControlName]="field.name"
                                    [placeholder]="field.placeholder"
                                    [required]="field.required"
                                >
                                <div class="password-icon">
                                    <i *ngIf="field.passwordField" class="fa" [ngClass]="{'fa-eye-slash': !field.isPasswordVisible,'fa-eye': field.isPasswordVisible}"
                                    (click)="togglePassword(i)"></i>
                                </div>
                            </div>
                            <div class="form-submit-button">
                              <button type="submit" class="btn btn-primary">{{ formConfig.submitBtnLabel }}</button>
                              <div class="seperator">
                                <span [textContent]="formConfig.separatorText"></span>
                              </div>
                            </div>
                        </form>
                        <div class="social-btn-container" *ngIf="formConfig.socialButton">
                            <a class="social-icon" href="javascript:void(0);" ><img src="../../../../assets/images/google.svg" class="img-responsive" /> </a>
                            <a class="social-icon" href="javascript:void(0);" ><img src="../../../../assets/images/apple.svg" class="img-responsive" /> </a>
                            <a class="social-icon" href="javascript:void(0);" ><img src="../../../../assets/images/linkedIn.svg" class="img-responsive" /> </a>
                        </div>
                        <div class="form-footer-notes" [textContent]="formConfig.footerNotes"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
