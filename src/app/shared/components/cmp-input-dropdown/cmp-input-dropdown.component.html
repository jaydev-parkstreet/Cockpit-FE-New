<div class="input-dropdown">
    <div class="dropdown-label" [ngClass]="{'required': required}">
        <span class="d-block" [textContent]="label" *ngIf="label"></span>
    </div>
    <div class="u-flex u-align-center u-justify-between" (click)="!disabled && !formControl?.disabled && toggleDropdown()">
        <input type='text' class="typography-paragraph-black-regular dropdown-headers u-truncate u-w-100"
            [attr.value]="getSelectedDisplayText()" [ngClass]="validationClasses"
            [placeholder]="settings.translationTexts.buttonDefaultText" tabindex="0" readonly>
        <i class="fal fa-times-circle position-absolute u-neutral-light u-csr-ptr clearSelectedItems"
            *ngIf="selectedItems?.length > 0" (click)="!disabled && !formControl?.disabled && clearSelectedItems($event)">
        </i>
        <button class="dropdown-button" *ngIf="settings.versionStyle !== 'smart-search'">
            <i [ngClass]="isDropdownOpen() ? 'fal fa-chevron-up' : 'fal fa-chevron-down'" aria-hidden="true"></i>
        </button>
    </div>

    <div class="dropdown-list" *ngIf="isOpen">
        <div class="search-box" *ngIf="showSearch">
            <input type="text" class="form-control" [(ngModel)]="searchText" placeholder="Search"
                (input)="filterItems()">
            <i class="far fa-times-circle u-absolute clear-search body u-fs14 u-csr-ptr" *ngIf="searchText"
                (click)="clearSearch($event)">
            </i>
            <button class="search-icon">
                <i class="far fa-search" aria-hidden="true"></i>
            </button>
        </div>

        <div class="dropdown-content">
            <div *ngIf="isLoading" class="loader">
                <i class="fas fa-spinner fa-spin"></i>
                <span>{{ texts.loaderText }}</span>
            </div>
            <div  class="no-results" *ngIf="hideList">
                <i class="fas fa-times"></i>
                <span>{{ texts.noResultText }}</span>
            </div>

            <div *ngIf="!hideList">
                <div *ngIf="showSelectAll" class="select-all" (click)="toggleSelectAll()">
                    <div class="checkbox" [ngClass]="{'checked': isAllSelected, 'unchecked': !isAllSelected}">
                        <span *ngIf="!isAllSelected">+</span>
                        <span *ngIf="isAllSelected">-</span>
                    </div>
                    <span>{{ isAllSelected ? texts.uncheckAll : texts.selectAll }}</span>
                </div>

                <div *ngFor="let item of filteredItems | slice:0:200" class="select-list"
                    (click)="!disabled && !formControl?.disabled && toggleSelection(item)">
                    <input *ngIf="showCheckboxes" type="checkbox" [checked]="isSelected(item)"
                        (change)="onDropDownChange.emit(selectedItems)" />
                    <span>{{ item.name }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
