<button type="button" class="btn app-cmp-button u-flex u-align-center u-justify-center"
    [class]="buttonClass" (click)="onClick.emit()" [disabled]="isDisable">
    <i *ngIf="buttonIconLeft" class="u-pg-mr-1" [class]="buttonIconLeft"></i>
    <span [textContent]="buttonText"></span>
    <i *ngIf="buttonIconRight" class="u-pg-ml-1" [class]="buttonIconRight"></i>
</button>
