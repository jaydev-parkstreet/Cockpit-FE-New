<div class="summary-boxes" id="summary-boxes">
    <div class="previous-box u-flex u-justify-between u-align-center">
        <i class="fal fa-chevron-left"></i>
    </div>

    <div class="summary-box" *ngFor="let boxData of summaryBoxData; let i = index">
        <div class="typography-body-dark-medium summary-header">
            <span>{{ boxData.title }}</span>
            <div class="info-tooltip" *ngIf="boxData.headerIconClass">
                <i class="{{boxData.headerIconClass}} icon-class"></i>
                <span class="typography-body-black-regular white-tooltip " *ngIf="boxData.headerToolTip">
                    {{ boxData.headerToolTip }}
                </span>
            </div>
        </div>

        <div *ngFor="let balance of boxData.data; let j = index">
            <div class="summary-value">
                <span class="typography-body-black-regular">{{ balance.value }}</span>
            </div>
           
        </div>
    </div>
 

    <div class="next-box u-flex u-justify-between u-align-center">
        <i class="fal fa-chevron-right"></i>
    </div>
</div>
