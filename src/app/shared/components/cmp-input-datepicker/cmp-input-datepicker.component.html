<div class="input-datepicker">
    <div>
        <div class="c-label" *ngIf="dateLabel">
            <label class="typography-paragraph-black-regular u-pg-mb-0" for="">{{dateLabel}}</label>
        </div>
        <div class="datepicker-container u-flex u-align-center u-justify-between u-relative">
            <input class="u-w-100" type="text" class="form-control" bsDatepicker #dp="bsDatepicker"
                style="visibility: none;" readonly />
            <span class="clear-date u-flex-center u-pg-s-2">
                <i class="fal fa-times-circle"></i>
            </span>
            <button type="button" class="dropdownbtn u-flex-center u-absolute" (click)="toggleDropdown()">
                <i class="fas fa-calendar-alt"></i>
            </button>
        </div>
    </div>
</div>
