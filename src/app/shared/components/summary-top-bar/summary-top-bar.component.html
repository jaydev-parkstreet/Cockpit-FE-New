<div class="summary-top-bar m-flex-direction mr-width">
    <div class="search-box-container m-margin" data-ng-hide="topBarConfig.hideSearch">
        <app-search-bar>
        </app-search-bar>
    </div>
    <app-excel-export [tooltipText]="tooltipText">
    </app-excel-export>
    <div>
        <app-cmp-button [buttonIconLeft]="'fas fa-filter'" [buttonText]="'Filter'" [buttonClass]="'secondary'"
            (click)="toggleFilter()">
        </app-cmp-button>

    </div>
    <div>
        <app-cmp-button [buttonIconLeft]="'fas fa-plus-circle '" [buttonText]="'New Product'" [buttonClass]="'primary'"
            (click)="addProduct.emit()">
        </app-cmp-button>
    </div>
</div>

<div class="filter-container" *ngIf="isExpandFilter">
    <div class="row">
        <div class="filter-item" [ngClass]="filter.divClass" *ngFor="let filter of config.filtersConfig">
            <app-cmp-input-dropdown
                [label]="filter.label"
                [showSelectAll]="true"
                [showCheckboxes]="true"
                [allowSingleSelect]="false"
                [settings]="filter.setting"
                [filteredItems]="filterList[filter.key]"
                (onDropDownChange)="onFilterChange(filter.key, $event)">
            </app-cmp-input-dropdown>
        </div>
    </div>
    <div class="u-flex u-align-center u-pg-py-2">
        <app-cmp-button
            [buttonClass]="'primary sm'"
            [buttonText]=" 'Apply' "
            (click)="applyFilterChanges()">
        </app-cmp-button>
        <div class="btn-link primary-link u-pg-ml-3" (click)="resetFilterChanges()">Clear</div>
    </div>
</div>
