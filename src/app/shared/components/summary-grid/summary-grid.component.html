
<div>
    <div class="checkbox-container" *ngIf="selectAllOption">
        <label>
          <input type="checkbox" #checkboxSelectAll (change)="onSelectAllChange($event)"/>
          <span class="checkmark"></span>
        </label>
    </div>
    <ag-grid-angular
        class="ag-theme-material ag-grid-custom"
        style="height: 100vh; width: 100%;"
        [gridOptions]="gridOptions">
    </ag-grid-angular>
</div>
