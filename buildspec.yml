version: 0.2
phases:
  install:
    commands:
      - echo Installing nvm...
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
      - export NVM_DIR="$HOME/.nvm"
      - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
      - '[ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"'
  pre_build:
    commands:
      #install dependencies
      - . "$NVM_DIR/nvm.sh" && nvm install 10.24.1 
      - echo Installing node...
      - echo Installing npm...
      - node --version
  build:
    commands:
      #build
      - echo building...
      - node --version
      - echo "Building the project..."
      - gem install ffi -v 1.16.3
      - gem install sass
      - npm install --global gulp-cli
      - npm install -g @angular/cli@10.2.4 --unsafe-perm=true --allow-root
      - npm install
  #    - gulp sass
  #    - gulp views
      - ng build --configuration=${env} --verbose
      - ls -ltrh dist
  post_build:
    commands:
      - bash -c "if [ /"$CODEBUILD_BUILD_SUCCEEDING/" == /"0/" ]; then exit 1; fi"
      - aws s3 rm s3://${S3_BUCKET_COCKPIT} --recursive
      - aws s3 cp dist/Cockpit-FE s3://${S3_BUCKET_COCKPIT} --recursive --acl public-read
      - aws cloudfront create-invalidation --distribution-id ${CF_DISTRIBUTION_COCKPIT} --paths "/*"
      - echo "Build completed on $(date)"      

artifacts:
  files:
    - '**/*'
  base-directory: dist/COCKPIT-FE
